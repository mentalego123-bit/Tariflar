<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script><title>AutoPayuz — Tariflar</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#10131a;--mu:#667085;--bd:#e4e7ee;--ac:#4f46e5;--ac2:#06b6d4;--ok:#16a34a}
@media(prefers-color-scheme:dark){:root{--bg:#0b0e14;--card:#131824;--tx:#eef1f7;--mu:#8b94a7;--bd:#222a3a}}
*{box-sizing:border-box}body{margin:0;font:16px/1.6 Inter,system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--tx)}
a{text-decoration:none;color:var(--ac)}
nav{display:flex;gap:6px;align-items:center;padding:12px 5vw;border-bottom:1px solid var(--bd)}
nav b{margin-right:auto;font-size:19px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;color:transparent}
nav a{color:var(--tx);padding:7px 14px;border-radius:10px;font-weight:600;font-size:14px}nav a:hover{background:var(--bd)}
.hero{text-align:center;padding:60px 5vw 30px;background:radial-gradient(60% 90% at 50% 0,color-mix(in srgb,var(--ac) 22%,transparent),transparent)}
.hero h1{font-size:clamp(30px,6vw,52px);line-height:1.1;margin:0 0 12px;letter-spacing:-1.5px}.hero h1 span{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;color:transparent}
.hero p{color:var(--mu);max-width:560px;margin:0 auto}
#plans{max-width:760px;margin:20px auto 60px;padding:0 5vw;display:flex;flex-direction:column;gap:14px}
.pc{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:20px;overflow:hidden;opacity:0;transform:translateY(24px);animation:in .6s cubic-bezier(.2,.8,.2,1) forwards;transition:box-shadow .3s,border-color .3s}
@keyframes in{to{opacity:1;transform:none}}
.pc:hover{box-shadow:0 14px 36px rgba(79,70,229,.15)}
.pc.open{border-color:var(--ac);box-shadow:0 18px 44px rgba(79,70,229,.2)}
.pc.hot:before{content:"Mashhur";position:absolute;top:0;right:60px;background:linear-gradient(90deg,var(--ac),#7c3aed);color:#fff;font-size:11px;font-weight:700;padding:3px 12px;border-radius:0 0 10px 10px}
.pc.max:before{content:"👑 MAX";position:absolute;top:0;right:60px;background:linear-gradient(90deg,#f59e0b,#ef4444);color:#fff;font-size:11px;font-weight:700;padding:3px 12px;border-radius:0 0 10px 10px}
.hd{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:14px;padding:20px 22px;cursor:pointer}
.ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,var(--ac),var(--ac2));flex:none}
.nm{flex:1}.nm h3{margin:0;font-size:20px}.nm small{color:var(--mu);font-size:13px}
.pr{font-size:22px;font-weight:800;letter-spacing:-.5px;text-align:right}.pr small{display:block;font-size:12px;color:var(--mu);font-weight:500}
.ch{width:28px;height:28px;border-radius:50%;background:var(--bd);display:grid;place-items:center;flex:none;transition:transform .4s,background .3s}
.ch:after{content:"";width:8px;height:8px;border:solid var(--tx);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-2px,-2px)}
.open .ch{transform:rotate(180deg);background:var(--ac)}.open .ch:after{border-color:#fff}
.bd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s cubic-bezier(.4,0,.2,1)}.open .bd{grid-template-rows:1fr}
.bd>div{overflow:hidden}.in{padding:0 22px 22px}
ul{list-style:none;padding:0;margin:0 0 18px}
li{padding:8px 0;border-bottom:1px dashed var(--bd);font-size:15px;opacity:0;transform:translateX(-12px);transition:.4s}
li:last-child{border:0}li:before{content:"✓ ";color:var(--ok);font-weight:800}li.e:before{content:""}
.open li{opacity:1;transform:none;transition-delay:calc(var(--i)*60ms + .15s)}
.btn{display:block;text-align:center;padding:14px;border-radius:14px;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--ac),#7c3aed);box-shadow:0 8px 24px color-mix(in srgb,var(--ac) 40%,transparent);transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
@media(max-width:520px){.pr{font-size:18px}.ic{display:none}}
</style></head><body>
<nav><b>⚡ AutoPayuz</b></nav>
<div class="hero"><h1>O'zingizga mos <span>tarifni tanlang</span></h1><p>Tarifni bosib oching va «Ulash» ni bosing: balans yetarli bo'lsa tarif avtomatik ulanadi.</p></div>
<div id="plans"><p style="text-align:center;color:var(--mu)">Yuklanmoqda…</p></div>
<script>
try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}
const BOT="autopayuz_robot",fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g," "),E=["🌱","🚀","💎","👑"];
const esc=s=>s.replace(/</g,"&lt;");
const D=[{id:1,name:"Start",price:10000,days:30,tx_limit:200,cards:1,notify:false,features:["Statistika, tushum, pul yechish"]},
{id:2,name:"Standart",price:20000,days:30,tx_limit:750,cards:3,notify:true,features:["Sof foyda, API sog'lomligi, o'rtacha chek, muvaffaqiyat %"]},
{id:3,name:"Pro",price:30000,days:30,tx_limit:3000,cards:10,notify:true,features:["Kunlik hisobot (10 kun)","⚡️ Pullar 2–5 soat ichida tashlab beriladi"]},
{id:4,name:"Turbo",price:52000,days:30,tx_limit:0,cards:20,notify:true,features:["Maxsus to'liq bildirishnomalar","📅 To'liq kunlik hisobot (30 kun)","📈 Sof foyda, xarajat va komissiya tahlili","🩺 API sog'lomligi va muammolar hisoboti","🏆 Eng katta/oxirgi to'lov, webhook holati","⚡️ Pullar 5 daqiqa ichida tashlab beriladi","👑 MAX: barcha funksiyalar, maxsus funksiyalar"]}];
fetch("/api/public/tariffs").then(r=>r.json()).catch(()=>D).then(ts=>{
 plans.innerHTML=ts.map((t,k)=>{
  const mx=k==ts.length-1&&ts.length>3,L=[t.tx_limit?fmt(t.tx_limit)+" ta to'lov":"♾ Cheksiz tranzaksiya",t.cards+" ta karta",t.notify?"Har bir to'lovga bildirishnoma":"Bildirishnoma yo'q",...t.features.filter(Boolean).map(f=>f.replace(/^\+\s*/,""))];
  return `<div class="pc ${t.id==3?'hot':''} ${mx?'max':''}" style="animation-delay:${k*100}ms"><button class="hd" onclick="tg(this.parentNode)"><span class="ic">${E[k%4]}</span><span class="nm"><h3>${esc(t.name)}</h3><small>${t.days} kunlik obuna</small></span><span class="pr">${fmt(t.price)}<small>so'm</small></span><span class="ch"></span></button>
  <div class="bd"><div><div class="in"><ul>${L.map((x,i)=>`<li style="--i:${i}">${esc(x)}</li>`).join("")}</ul><a class="btn" href="https://t.me/${BOT}?start=buy_${t.id}" onclick="go(event,this.href)">Ulash →</a></div></div></div></div>`}).join("");
 plans.children[Math.min(2,ts.length-1)].classList.add("open")
}).catch(()=>plans.innerHTML=`<p style="text-align:center">Tariflarni botda ko'ring: <a href="https://t.me/${BOT}">@${BOT}</a></p>`);
function go(e,u){const w=window.Telegram&&Telegram.WebApp;if(w&&w.initData){e.preventDefault();w.openTelegramLink(u);setTimeout(()=>w.close(),300)}}
function tg(c){const o=c.classList.contains("open");[...plans.children].forEach(x=>x.classList.remove("open"));if(!o)c.classList.add("open")}
</script></body></html>
